[package]
name = "bibleos"
version = "0.1.2"
description = "BibleOS: a calm, local-first Bible study app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "bibleos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Swapping the Dock icon to match the app theme (macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# In-app updates from GitHub Releases, and relaunching after an update (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
