[package]
name = "bibleos"
version = "0.1.0"
description = "BibleOS: a calm, local-first Bible study app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "bibleos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
